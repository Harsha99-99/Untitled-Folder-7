# wrangler.toml — Cloudflare Worker: static pages + audio relay (Durable Object).
#
# The Git-connected build runs `npx wrangler deploy` from the repo root, which
# reads this file, bundles worker/index.ts (+ worker/hub.ts), uploads webapp/
# as static assets, and applies the Durable Object migration below.
#
# name MUST match the existing Worker so deploys update it rather than spawning
# a new one.

name = "untitled-folder-7"
main = "worker/index.ts"
compatibility_date = "2026-08-01"

# Serve the sender + monitor pages straight from webapp/. Asset paths are
# served directly; only /ws falls through to the Worker (see worker/index.ts).
[assets]
directory = "./webapp"
binding = "ASSETS"
# REQUIRED for the host split to mean anything. By default Cloudflare serves a
# matching static file BEFORE the Worker runs, so monitor.html was still
# reachable on the public broadcast host even though the Worker refuses it.
# Running the Worker first makes it the gatekeeper; it defers to assets via
# env.ASSETS.fetch() once the request is allowed.
run_worker_first = true

# The relay. One SQLite-backed Durable Object class; the free Workers plan
# supports these and is not billed for their storage.
[[durable_objects.bindings]]
name = "HUB"
class_name = "AudioHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AudioHub"]

# Serve from the custom domain as well as the workers.dev URL. Cloudflare
# provisions the DNS record and certificate on deploy because the zone is
# already on this account.
#
# Deliberately a SUBDOMAIN: thesaratech.com itself serves an existing site, and
# routing the apex here would take that site down.
# Admin monitor: sign-in required.
[[routes]]
pattern = "hub.thesaratech.com"
custom_domain = true

# Public broadcast page: open to anyone, serves the sender only. The Worker
# refuses the monitor, the API and the listener WebSocket role on this host.
[[routes]]
pattern = "listen.thesaratech.com"
custom_domain = true

# HUB_TOKEN gates the monitor/listener role. It is intentionally NOT set here —
# add it as an encrypted secret so it never lives in the repo:
#     npx wrangler secret put HUB_TOKEN
# or set it as a Variable in the Worker's dashboard (Settings → Variables).
# While unset, listening is OPEN (fine for a first connectivity test only).
