# config/filters.conf
# Wireshark / tshark display-filter snippets for Bluetooth audio analysis.
# Load in Wireshark or use with: tshark -Y "<filter>"

# All Bluetooth HCI traffic
bthci_cmd or bthci_evt or bthci_acl or bthci_sco

# SCO (synchronous, voice) packets only
bthci_sco

# HFP (Hands-Free Profile) over RFCOMM
btrfcomm and bthfp

# A2DP media / AVDTP
btavdtp

# SDP service discovery
btsdp

# Pairing / security manager
btsmp or bthci_evt.code == 0x06   # Authentication Complete
