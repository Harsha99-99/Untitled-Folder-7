<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hub Monitor — live devices</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="login" class="tap-overlay" hidden>
    <form id="loginForm" style="background:var(--panel);padding:24px;border-radius:12px;border:1px solid var(--border);min-width:280px;max-width:340px">
      <div class="tap-big" style="font-size:19px;margin-bottom:4px">Sign in</div>
      <div class="tap-sub" style="margin-bottom:16px">Monitor access is restricted.</div>
      <label class="hint" for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required
             style="width:100%;padding:9px 10px;margin:4px 0 12px;border-radius:8px;background:var(--bg);color:var(--fg);border:1px solid var(--border)" />
      <label class="hint" for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required
             style="width:100%;padding:9px 10px;margin:4px 0 16px;border-radius:8px;background:var(--bg);color:var(--fg);border:1px solid var(--border)" />
      <button id="loginBtn" class="primary" type="submit" style="width:100%">Sign in</button>
      <div id="loginErr" class="hint" style="color:#e53e3e;margin-top:10px;min-height:18px"></div>
    </form>
  </div>

  <main>
    <h1>Hub Monitor <span class="tag">live</span>
      <button id="signOut" class="ghost" type="button" hidden style="float:right;font-size:12px">Sign out</button>
    </h1>
    <p class="sub">Live audio from every remote device streaming to this hub.
      Click a device to listen. Token-gated — only reachable with your hub token.</p>

    <section class="row">
      <span id="status" class="hint">connecting…</span>
      <span style="flex:1"></span>
      <label class="chk"><span>Volume</span>
        <input type="range" id="vol" min="0" max="100" value="100" style="width:140px" /></label>
      <button id="stopBtn" class="ghost" disabled>■ Stop listening</button>
    </section>

    <section class="row wrap" style="gap:14px">
      <label class="chk"><input type="checkbox" id="dspOn" checked /> <span>Enhance voice</span></label>
      <label class="chk"><input type="checkbox" id="dspHp" checked /> <span>Highpass 110 Hz</span></label>
      <label class="chk"><input type="checkbox" id="dspAgc" checked /> <span>Auto level</span></label>
      <label class="chk"><input type="checkbox" id="dspGate" checked /> <span>Noise gate</span></label>
    </section>

    <section id="devices" class="devices-list"></section>

    <section class="meter">
      <div class="meterbar"><div id="meterFill"></div></div>
      <div id="meterLbl" class="mono">— idle —</div>
    </section>

    <canvas id="wave" width="900" height="160"></canvas>

    <section class="row" style="margin-top:18px">
      <h2 style="font-size:15px;margin:0">Recordings</h2>
      <span style="flex:1"></span>
      <button id="recRefresh" class="ghost" type="button">Refresh</button>
    </section>
    <section id="recordings" class="devices-list"></section>
    <audio id="recPlayer" controls style="width:100%;margin-top:8px;display:none"></audio>

    <pre id="log" class="log"></pre>
  </main>
  <script type="module" src="monitor.js"></script>
</body>
</html>
